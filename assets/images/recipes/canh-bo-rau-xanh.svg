<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <linearGradient id="grad_canh-bo-rau-xanh.svg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0fdf4" />
            <stop offset="100%" stop-color="#86efac" />
        </linearGradient>
        <filter id="shadow_canh-bo-rau-xanh.svg" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15803d" flood-opacity="0.18" />
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="800" height="500" fill="url(#grad_canh-bo-rau-xanh.svg)" />
    
    <!-- Decorative kitchen circles -->
    <circle cx="720" cy="80" r="140" fill="#15803d" opacity="0.06" />
    <circle cx="100" cy="420" r="180" fill="#15803d" opacity="0.05" />
    
    <!-- Inner dish plate presentation card -->
    <rect x="70" y="50" width="660" height="400" rx="28" fill="#ffffff" filter="url(#shadow_canh-bo-rau-xanh.svg)" />
    
    <!-- Accent Top Ribbon -->
    <rect x="70" y="50" width="660" height="10" rx="5" fill="#15803d" />
    
    <!-- Category Badge -->
    <rect x="110" y="85" width="160" height="34" rx="17" fill="#15803d" />
    <text x="190" y="108" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">Bữa Cơm Thanh Đạm</text>
    
    <!-- Center Food Emoji Icon Badge -->
    <circle cx="400" cy="205" r="75" fill="#f0fdf4" stroke="#86efac" stroke-width="4" />
    <text x="400" y="235" font-size="76" text-anchor="middle">🥣</text>
    
    <!-- Dish Title -->
    <text x="400" y="325" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Canh Bò Nấu Rau Xanh</text>
    
    <!-- Subtitle / Cooking notes -->
    <text x="400" y="360" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Bổ dưỡng giải nhiệt ngọt lịm từng thìa canh</text>
    
    <!-- Brand watermark -->
    <text x="400" y="415" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">COOKIO • BẾP NHÀ SUM VẦY</text>
</svg>