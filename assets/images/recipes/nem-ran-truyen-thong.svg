<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <linearGradient id="grad_nem-ran-truyen-thong.svg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb" />
            <stop offset="100%" stop-color="#fcd34d" />
        </linearGradient>
        <filter id="shadow_nem-ran-truyen-thong.svg" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b45309" flood-opacity="0.18" />
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="800" height="500" fill="url(#grad_nem-ran-truyen-thong.svg)" />
    
    <!-- Decorative kitchen circles -->
    <circle cx="720" cy="80" r="140" fill="#b45309" opacity="0.06" />
    <circle cx="100" cy="420" r="180" fill="#b45309" opacity="0.05" />
    
    <!-- Inner dish plate presentation card -->
    <rect x="70" y="50" width="660" height="400" rx="28" fill="#ffffff" filter="url(#shadow_nem-ran-truyen-thong.svg)" />
    
    <!-- Accent Top Ribbon -->
    <rect x="70" y="50" width="660" height="10" rx="5" fill="#b45309" />
    
    <!-- Category Badge -->
    <rect x="110" y="85" width="160" height="34" rx="17" fill="#b45309" />
    <text x="190" y="108" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">Món Cỗ Ngày Lễ</text>
    
    <!-- Center Food Emoji Icon Badge -->
    <circle cx="400" cy="205" r="75" fill="#fffbeb" stroke="#fcd34d" stroke-width="4" />
    <text x="400" y="235" font-size="76" text-anchor="middle">🥟</text>
    
    <!-- Dish Title -->
    <text x="400" y="325" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Nem Rán Truyền Thống</text>
    
    <!-- Subtitle / Cooking notes -->
    <text x="400" y="360" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Vỏ giòn tan nhân thịt miến mộc nhĩ nấm hương</text>
    
    <!-- Brand watermark -->
    <text x="400" y="415" fill="#b45309" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">COOKIO • BẾP NHÀ SUM VẦY</text>
</svg>