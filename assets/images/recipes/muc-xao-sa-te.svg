<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <linearGradient id="grad_muc-xao-sa-te.svg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff1f2" />
            <stop offset="100%" stop-color="#fda4af" />
        </linearGradient>
        <filter id="shadow_muc-xao-sa-te.svg" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#be123c" flood-opacity="0.18" />
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="800" height="500" fill="url(#grad_muc-xao-sa-te.svg)" />
    
    <!-- Decorative kitchen circles -->
    <circle cx="720" cy="80" r="140" fill="#be123c" opacity="0.06" />
    <circle cx="100" cy="420" r="180" fill="#be123c" opacity="0.05" />
    
    <!-- Inner dish plate presentation card -->
    <rect x="70" y="50" width="660" height="400" rx="28" fill="#ffffff" filter="url(#shadow_muc-xao-sa-te.svg)" />
    
    <!-- Accent Top Ribbon -->
    <rect x="70" y="50" width="660" height="10" rx="5" fill="#be123c" />
    
    <!-- Category Badge -->
    <rect x="110" y="85" width="160" height="34" rx="17" fill="#be123c" />
    <text x="190" y="108" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">Món Nhậu & Tụ Tập</text>
    
    <!-- Center Food Emoji Icon Badge -->
    <circle cx="400" cy="205" r="75" fill="#fff1f2" stroke="#fda4af" stroke-width="4" />
    <text x="400" y="235" font-size="76" text-anchor="middle">🦑</text>
    
    <!-- Dish Title -->
    <text x="400" y="325" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Mực Xào Sa Tế Cay Nồng</text>
    
    <!-- Subtitle / Cooking notes -->
    <text x="400" y="360" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Mực tươi giòn sần sật ớt chuông hành tây đậm vị</text>
    
    <!-- Brand watermark -->
    <text x="400" y="415" fill="#be123c" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">COOKIO • BẾP NHÀ SUM VẦY</text>
</svg>