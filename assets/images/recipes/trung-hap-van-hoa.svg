<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_trung-hap-van-hoa.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <radialGradient id="glow_trung-hap-van-hoa.svg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.4" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="darkOverlay" x1="0%" y1="50%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#grad_trung-hap-van-hoa.svg)" />
  <circle cx="300" cy="180" r="160" fill="url(#glow_trung-hap-van-hoa.svg)" />

  <!-- Center culinary dish plate -->
  <circle cx="300" cy="180" r="125" fill="#ffffff" opacity="0.08" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <circle cx="300" cy="180" r="105" fill="rgba(0,0,0,0.2)"/>
  <text x="300" y="215" font-size="100" text-anchor="middle">🥚</text>

  <!-- Sizzling elements -->
  <circle cx="210" cy="120" r="8" fill="#eab308" opacity="0.75"/>
  <circle cx="390" cy="140" r="6" fill="#4ade80" opacity="0.8"/>
  <circle cx="370" cy="240" r="7" fill="#ef4444" opacity="0.8"/>

  <!-- Bottom title bar -->
  <rect x="0" y="260" width="600" height="140" fill="url(#darkOverlay)" />
  <text x="30" y="335" fill="#eab308" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
    Món hấp thanh ngọt
  </text>
  <text x="30" y="375" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">
    Trứng Hấp Vân Hoa
  </text>
</svg>